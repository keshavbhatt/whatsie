name: whatsie
adopt-info: whatsie
grade: stable
confinement: strict
base: core24
compression: lzo

title: Whatsie
summary: WhatsApp Web desktop client built with Qt WebEngine
website: https://github.com/keshavbhatt/whatsie
source-code: https://github.com/keshavbhatt/whatsie
issues: https://github.com/keshavbhatt/whatsie/issues
license: MIT
icon: snap/gui/icon.svg

platforms:
  amd64:
  arm64:

apps:
  whatsie:
    command: usr/bin/whatsie
    environment:
      QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox"
    desktop: usr/share/applications/com.ktechpit.whatsie.desktop
    common-id: com.ktechpit.whatsie
    extensions:
      - kde-neon-6
    plugs:
      - home
      - desktop
      - desktop-legacy
      - opengl
      - x11
      - wayland
      - network
      - unity7
      - browser-support
      - network-status
      - camera
      - audio-playback
      - audio-record
      - removable-media
      - screen-inhibit-control
      - hardware-observe
      - network-observe
      - network-bind
      - mount-observe

parts:
  whatsie:
    plugin: cmake
    source: .
    parse-info:
      - usr/share/metainfo/com.ktechpit.whatsie.metainfo.xml
    build-snaps:
      - cmake/latest/stable
    build-packages:
      - libxkbcommon-dev
      - libdrm-dev
      # Hunspell dictionaries: CMake converts these to .bdic at configure time
      # and bundles them for spell check (FEATURES L1, ADR-017). Base set only;
      # more languages are a download (L2).
      - hunspell-en-us
      - hunspell-en-gb
      - hunspell-de-de
      - hunspell-fr
      - hunspell-es
      - hunspell-it
      - hunspell-ru
    stage-packages:
      - libdrm2
      # libqxcb links against it; without it the snap does not start (W#320).
      - libxcb-shape0
      # OpenType coverage for confined Qt (the snap ships no host fonts).
      - fonts-noto-core
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DWHATSIE_BUILD_TESTS=OFF
    override-build: |
      craftctl default
      mkdir -p ${CRAFT_PART_INSTALL}/meta/gui
      cp ${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/256x256/apps/com.ktechpit.whatsie.png \
        ${CRAFT_PART_INSTALL}/meta/gui/icon.png
      sed -i "s|^Icon=.*|Icon=\${SNAP}/meta/gui/icon.png|" \
        ${CRAFT_PART_INSTALL}/usr/share/applications/com.ktechpit.whatsie.desktop
      # Spell-check dictionaries (FEATURES L1): convert the hunspell dicts pulled
      # in via build-packages to Chromium .bdic here, where the SDK's converter
      # AND its libraries are on the path (CMake's configure-time execute_process
      # cannot load them). Best-effort: logs what it finds and never fails build.
      convert="$(command -v qwebengine_convert_dict || true)"
      [ -n "$convert" ] || convert="$(find /snap/kde-qt6-core24-sdk/current /usr/lib -name qwebengine_convert_dict 2>/dev/null | head -1)"
      echo "whatsie: qwebengine_convert_dict = ${convert:-<not found>}"
      if [ -n "$convert" ]; then
        qtprefix="$(cd "$(dirname "$convert")/../../.." && pwd)"
        export LD_LIBRARY_PATH="$qtprefix/lib/$(uname -m)-linux-gnu:$qtprefix/lib:${LD_LIBRARY_PATH:-}"
        dictdir="${CRAFT_PART_INSTALL}/usr/share/whatsie/qtwebengine_dictionaries"
        mkdir -p "$dictdir"
        for aff in /usr/share/hunspell/*.aff; do
          [ -e "$aff" ] || continue
          base="$(basename "$aff" .aff)"
          dic="/usr/share/hunspell/${base}.dic"
          [ -f "$dic" ] || continue
          name="$(echo "$base" | tr '_' '-')"
          if "$convert" "$dic" "$dictdir/${name}.bdic"; then
            echo "whatsie: bundled dictionary ${name}"
          else
            echo "whatsie: failed to convert ${base}"
          fi
        done
        ls -la "$dictdir" || true
      fi
    prime:
      - -usr/include
      - -usr/lib/*/cmake
      - -usr/share/man
      - -usr/share/doc
