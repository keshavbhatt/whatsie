# Build the snap in GitHub's CI (we do not build locally). Each architecture is
# built on its native runner; on push the .snap is uploaded as an artifact, and
# with the repo variable PUBLISH_TO_STORE=true plus the SNAPCRAFT_STORE_CREDENTIALS
# secret it is also released to the edge channel.
name: snap

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'dist/**'
      - 'snap/**'
      - '.github/workflows/snap.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build snap (${{ matrix.arch }})
        uses: snapcore/action-build@v1
        id: build

      - name: Upload the snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatsie-snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

      - name: Publish to the Snap Store (edge)
        if: >-
          vars.PUBLISH_TO_STORE == 'true' &&
          github.ref == 'refs/heads/main' &&
          github.event_name == 'push'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: edge
