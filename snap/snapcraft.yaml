# Whatsie snap. Qt 6.11 comes from the kde-neon-6 extension (kf6-core24
# content snap) — the same runtime the dev scripts target, so what builds
# here is what we test locally. The GPU/audio/PipeWire wiring the dev-run
# scripts add by hand is provided natively by the extension here.
name: whatsie
adopt-info: whatsie          # version/summary/description from the AppStream file
grade: stable
confinement: strict
base: core24
compression: lzo

title: Whatsie
summary: WhatsApp Web desktop client built with Qt WebEngine
website: https://github.com/keshavbhatt/whatsie
source-code: https://github.com/keshavbhatt/whatsie
issues: https://github.com/keshavbhatt/whatsie/issues
license: MIT
icon: snap/gui/icon.svg

platforms:
  amd64:

# The Chromium sandbox stays ON (ADR-008): we never pass --no-sandbox, and
# allow-sandbox lets Chromium create the user namespaces its sandbox needs.
# Auto-connect in the store needs a snap declaration; a local install with
# `snap connect` works without one.
plugs:
  browser-sandbox:
    interface: browser-support
    allow-sandbox: true

apps:
  whatsie:
    command: usr/bin/whatsie
    desktop: usr/share/applications/com.ktechpit.whatsie.desktop
    common-id: com.ktechpit.whatsie
    extensions:
      - kde-neon-6
    plugs:
      - home
      - desktop
      - desktop-legacy
      - opengl
      - x11
      - wayland
      - network
      - network-bind
      - network-status
      - network-observe
      - browser-sandbox
      - camera
      - audio-playback
      - audio-record
      - removable-media
      - screen-inhibit-control
      - hardware-observe
      - unity7

parts:
  whatsie:
    plugin: cmake
    source: .
    parse-info:
      - usr/share/metainfo/com.ktechpit.whatsie.metainfo.xml
    build-snaps:
      - cmake/latest/stable
    build-packages:
      - libxkbcommon-dev
      - libdrm-dev
    stage-packages:
      - libdrm2
      # libqxcb needs it; without it the snap does not start (W#320-class).
      - libxcb-shape0
      # OpenType coverage for confined Qt (the snap ships no host fonts).
      - fonts-noto-core
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DWHATSIE_BUILD_TESTS=OFF
    override-build: |
      craftctl default
      # The snap's tray/desktop icon: an absolute path into the snap.
      mkdir -p ${CRAFT_PART_INSTALL}/meta/gui
      cp ${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/256x256/apps/com.ktechpit.whatsie.png \
        ${CRAFT_PART_INSTALL}/meta/gui/icon.png
      sed -i "s|^Icon=.*|Icon=\${SNAP}/meta/gui/icon.png|" \
        ${CRAFT_PART_INSTALL}/usr/share/applications/com.ktechpit.whatsie.desktop
    prime:
      - -usr/include
      - -usr/lib/*/cmake
      - -usr/share/man
      - -usr/share/doc
